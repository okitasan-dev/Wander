<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6E9E4" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0C2123" media="(prefers-color-scheme: dark)">
<title>Wander</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Wander">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#E6E9E4; --surface:#F3F4F0; --raise:#FFFFFF; --ink:#132A2C; --muted:#5B6D6C; --rule:rgba(19,42,44,.13);
  --brass:#8A672B; --brass-hi:#A8823F; --brass-soft:rgba(138,103,43,.10); --on-brass:#FFF9EC;
  --patina:#2B6C61; --shadow:0 10px 30px rgba(19,42,44,.16);
  --serif:"Source Serif 4","Noto Serif JP","Noto Serif SC","Noto Serif",Didot,Georgia,serif;
  --sans:"Schibsted Grotesk",-apple-system,BlinkMacSystemFont,"Noto Sans JP","Noto Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#0C2123; --surface:#122D30; --raise:#17373A; --ink:#E8EEE7; --muted:#8FA7A3; --rule:rgba(232,238,231,.11);
  --brass:#D0AE70; --brass-hi:#E3C68E; --brass-soft:rgba(208,174,112,.11); --on-brass:#1E180B;
  --patina:#5FB3A3; --shadow:0 12px 34px rgba(0,0,0,.45);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:400 16px/1.55 var(--sans);background:var(--ground);color:var(--ink);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
a{color:var(--brass)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
main{max-width:760px;margin:0 auto;padding-bottom:40px}

/* back to the main page */
.home{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;z-index:50;display:inline-flex;align-items:center;gap:7px;padding:8px 13px 8px 10px;
  border-radius:999px;background:color-mix(in srgb,var(--raise) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 2px 10px rgba(0,0,0,.14);border:1px solid var(--rule);color:var(--ink);text-decoration:none;font:italic 600 17px/1 var(--serif)}
.home svg{color:var(--brass)}

/* hero */
.hero{margin:0;position:relative;background:var(--surface)}
.hero img{display:block;width:100%;max-height:62vh;object-fit:cover}
.hero .credit{position:absolute;right:8px;bottom:8px;max-width:70%;font-size:11px;line-height:1.3;color:#fff;background:rgba(0,0,0,.45);padding:3px 7px;border-radius:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.nohero{height:calc(env(safe-area-inset-top) + 64px)}

/* heading */
.head{padding:22px 20px 4px}
.kind{font-size:13px;color:var(--muted);margin-bottom:6px}
h1{font:600 36px/1.1 var(--serif);letter-spacing:-.01em;margin:0}
.sub{font-size:15px;color:var(--muted);margin-top:6px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.links a,.links button{font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:999px;border:1px solid var(--rule);background:var(--surface)}

/* sections */
section{padding:0 20px}
h2{font:500 13px/1.3 var(--sans);color:var(--muted);margin:30px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h2 span{font-weight:400}
.summary p{margin:14px 0 0;font-size:17px;line-height:1.65;max-width:64ch}
.summary p:first-child{margin-top:18px}
.lang{font-size:12px;color:var(--muted)}
/* translate a passage: in place, Google, or Claude */
.xl{margin:8px 0 0}
.xl-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.xl-b{font-size:13px;font-weight:500;color:var(--brass);text-decoration:none;padding:3px 0}
.xl-b:first-child{border:1px solid color-mix(in srgb,var(--brass) 55%,transparent);border-radius:999px;padding:3px 11px}
.xl-out{margin:10px 0;padding:11px 13px;border-left:3px solid var(--brass);background:var(--brass-soft);border-radius:0 8px 8px 0;font-size:16px;line-height:1.6;white-space:pre-line}
.xl-out small,.xl-note{display:block;margin-top:6px;font-size:12px;color:var(--muted);white-space:normal}
.xlate{display:inline-block;margin-top:10px;font-size:14px;font-weight:500;color:var(--brass);text-decoration:none}
.gather{font-size:14px;color:var(--muted);margin:12px 0 0}
.spin{display:inline-block;width:11px;height:11px;border:1.5px solid var(--brass);border-top-color:transparent;border-radius:50%;margin-right:7px;vertical-align:-1px}
@media (prefers-reduced-motion:no-preference){.spin{animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}}
.factgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px;margin:0;border-top:1px solid var(--rule)}
.factgrid>div{padding:10px 0;border-bottom:1px solid var(--rule)}
.factgrid .wide{grid-column:1 / -1}
.factgrid dt{font-size:12px;color:var(--muted);margin-bottom:2px}
.factgrid dd{margin:0;font:600 17px/1.3 var(--serif);font-variant-numeric:lining-nums}
.factgrid dd small{font:400 12px var(--sans);color:var(--muted);margin-left:4px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--rule);font-size:15.5px;line-height:1.55}
.timeline li:last-child{border-bottom:1px solid var(--rule)}
.timeline .yr{font:600 18px/1.3 var(--serif);color:var(--brass);font-variant-numeric:lining-nums}
.factoids{list-style:none;margin:0;padding:0}
.factoids li{position:relative;padding:11px 0 11px 18px;border-top:1px solid var(--rule);font-size:15.5px;line-height:1.55}
.factoids li:last-child{border-bottom:1px solid var(--rule)}
.factoids li::before{content:"";position:absolute;left:2px;top:20px;width:6px;height:6px;border-radius:50%;background:var(--brass)}
.factoids i{font-family:var(--serif);font-size:16.5px}
.factoids h4{display:none}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:0 -20px}
@media (min-width:600px){.gallery{grid-template-columns:repeat(4,minmax(0,1fr));margin:0}}
.gallery button{position:relative;aspect-ratio:1;padding:0;overflow:hidden;background:var(--surface)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .yr{position:absolute;left:5px;bottom:5px;font:600 12px/1 var(--sans);color:#fff;background:rgba(0,0,0,.55);padding:3px 6px;border-radius:4px;font-variant-numeric:lining-nums}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(5,12,13,.94);display:flex;flex-direction:column;color:#EEF2EE}
.lightbox[hidden]{display:none}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 12px 6px}
.lb-top button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.lb-count{font-size:13px;color:#B9C6C3}
.lb-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;color:#fff;display:grid;place-items:center;background:rgba(0,0,0,.25)}
.lb-prev{left:0;border-radius:0 10px 10px 0}.lb-next{right:0;border-radius:10px 0 0 10px}
.lb-cap{padding:12px 18px calc(env(safe-area-inset-bottom) + 16px);font-size:14px;line-height:1.5;max-height:34vh;max-height:34dvh;overflow:auto}
.lb-cap .d{font:600 15px var(--serif);color:#E3C68E;margin-right:8px}
.lb-cap .cr{display:block;margin-top:6px;font-size:12px;color:#B9C6C3}
.lb-cap a{color:#E3C68E}

/* timeline */
.tl-wrap{margin:0 -20px}
.tl{position:relative;height:262px;overflow:hidden;touch-action:pan-y;cursor:grab;background:var(--surface);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  user-select:none;-webkit-user-select:none;outline-offset:-2px}
.tl:active{cursor:grabbing}
.tl-axis{position:absolute;left:0;right:0;top:222px;height:1.5px;background:var(--muted);opacity:.45}
.tl-tick{position:absolute;top:222px;width:1px;height:7px;background:var(--muted)}
.tl-tick span{position:absolute;top:10px;left:50%;transform:translateX(-50%);font:500 11.5px/1 var(--sans);color:var(--muted);white-space:nowrap;font-variant-numeric:lining-nums}
.tl-break{position:absolute;top:216px;height:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;
  background-image:repeating-linear-gradient(90deg,var(--muted) 0 3px,transparent 3px 7px);background-size:100% 1.5px;background-position:center;background-repeat:no-repeat}
.tl-break span{font:500 11px/1 var(--sans);color:var(--muted);background:var(--surface);padding:0 6px;white-space:nowrap}
.tl-stage{position:absolute;inset:0}
.tl-dot{position:absolute;top:218px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 2px var(--surface);z-index:1}
.tl-dot.photo{background:var(--patina)}
.tl-dot.work,.tl-dot.burial{background:var(--muted)}
.tl-stem{position:absolute;width:1px;margin-left:-.5px;background:var(--brass);opacity:.45}
.tl-card{position:absolute;left:0;top:0;width:136px;height:60px;display:flex;gap:7px;align-items:stretch;padding:5px 7px 5px 5px;border-radius:9px;
  background:var(--raise);border:1px solid var(--rule);box-shadow:0 2px 8px rgba(0,0,0,.08);text-align:left;overflow:hidden;z-index:2}
.tl-card img{width:48px;height:48px;object-fit:cover;border-radius:5px;flex:none;background:var(--surface)}
.tl-card .tx{min-width:0;display:flex;flex-direction:column;padding-left:2px}
.tl-card b{font:600 14px/1.15 var(--serif);color:var(--brass);font-variant-numeric:lining-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:30px}
.tl-card .tx>span{font-size:11.5px;line-height:1.28;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.tl-card.photo{border-color:color-mix(in srgb,var(--patina) 45%,transparent)}
.tl-card .more{position:absolute;right:4px;top:4px;font:600 10.5px/1 var(--sans);font-style:normal;background:var(--brass);color:var(--on-brass);border-radius:999px;padding:3px 6px}
.tl-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 20px 14px}
.tl-ctrl{display:flex;gap:4px;flex:none}
.tl-ctrl button{min-width:34px;height:34px;padding:0 9px;border-radius:999px;background:color-mix(in srgb,var(--raise) 90%,transparent);border:1px solid var(--rule);
  box-shadow:0 1px 4px rgba(0,0,0,.1);font-size:17px;font-weight:500;line-height:1}
.tl-ctrl button[data-z="fit"]{font-size:13px}
.tl-hint{font-size:12.5px;line-height:1.35;color:var(--muted);margin:0}
.tl-list li{padding-left:10px;margin-left:-10px;transition:box-shadow .2s}
.tl-list li.vis{box-shadow:inset 3px 0 0 var(--brass)}
.tl-list li{cursor:pointer}
.tl-list .tx{display:flex;gap:10px;align-items:flex-start}
.tl-list .tx img{width:44px;height:44px;object-fit:cover;border-radius:5px;flex:none;background:var(--surface)}

/* event sheet */
.ev{position:fixed;inset:0;z-index:90;background:rgba(5,16,17,.5);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top) + 12px)}
.ev[hidden]{display:none}
.ev-panel{position:relative;width:100%;max-width:560px;max-height:100%;overflow:auto;overscroll-behavior:contain;background:var(--raise);border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  padding:0 0 calc(env(safe-area-inset-bottom) + 20px)}
.ev-panel img{display:block;width:100%;max-height:46vh;max-height:46dvh;object-fit:contain;background:#0b1516;border-radius:20px 20px 0 0}
.ev-body{padding:16px 20px 0}
.ev-date{font:600 26px/1.1 var(--serif);color:var(--brass);font-variant-numeric:lining-nums}
.ev-body h3{font:600 20px/1.3 var(--serif);margin:6px 0 0}
.ev-body h3:empty{display:none}
.ev-body p{font-size:16px;line-height:1.6;margin:10px 0 0}
.ev-body p:empty{display:none}
.ev-src{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.5}
.ev-src .cr{display:block}
.ev-top{position:sticky;top:0;height:0;z-index:3}
.ev-close{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;z-index:2}

/* event layout: key points and photos first */
.when{margin-top:10px;font:600 17px/1.4 var(--serif);color:var(--brass)}
.when a{color:inherit;text-decoration-color:color-mix(in srgb,var(--brass) 40%,transparent);text-underline-offset:3px}
.when .sep{color:var(--muted);font-weight:400;margin:0 6px}
body.event main{display:flex;flex-direction:column}
body.event .hero,body.event .nohero{order:0} body.event .head{order:1} body.event #summary{order:2} body.event #gallery{order:3}
body.event #guideSec{order:2} body.event #facts{order:4} body.event #trivia{order:5} body.event #history{order:6} body.event #credits{order:7}
.points{list-style:none;margin:18px 0 0;padding:0}
.points li{position:relative;padding:10px 0 10px 22px;border-top:1px solid var(--rule);font-size:16.5px;line-height:1.55}
.points li:last-child{border-bottom:1px solid var(--rule)}
.points li::before{content:"";position:absolute;left:3px;top:19px;width:8px;height:8px;border-radius:2px;background:var(--brass);transform:rotate(45deg)}
.fullsum{margin-top:12px}
.fullsum summary{cursor:pointer;color:var(--brass);font-weight:500;font-size:15px;padding:6px 0}
.factgrid dd a{color:inherit;text-decoration-color:color-mix(in srgb,var(--brass) 45%,transparent);text-underline-offset:3px}

/* AI guide */
.gh-sum{margin:12px 0 0;font-size:16.5px;line-height:1.6}
.see{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--brass-soft);font-size:15.5px;line-height:1.5}
.see b{display:block;font:600 12px/1.3 var(--sans);color:var(--brass);letter-spacing:.02em;margin-bottom:3px}
.see small{display:block;margin-top:5px;font-size:12.5px;color:var(--muted)}
.gsrc{list-style:none;margin:12px 0 0;padding:0;font-size:13px;color:var(--muted);line-height:1.45}
.gsrc li{margin:3px 0}
.gsrc a{color:var(--muted)}
.tl-dot.guide{background:var(--raise);box-shadow:inset 0 0 0 2px var(--brass),0 0 0 2px var(--surface)}

/* credits */
.credits{font-size:13px;color:var(--muted);line-height:1.5}
.credits .ver{font-size:11px;opacity:.7;margin-top:14px}
.credits a{color:var(--muted)}
.credits details{margin-top:8px}
.credits summary{cursor:pointer;color:var(--ink)}
.credits ol{padding-left:20px;margin:8px 0 0}
.credits li{margin:4px 0}
.err{padding:120px 24px 40px;max-width:520px}
.err h1{font-size:28px;margin-bottom:12px}
</style>
</head>

<a class="home" href="./" id="homeBtn"><svg width="18" height="18" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="16" cy="16" r="14.5"/><path d="M16 5.5 19 16 16 26.5 13 16Z" fill="currentColor" stroke="none"/></svg>Wander</a>

  <figure class="hero" id="hero" hidden><img id="heroImg" alt=""><a class="credit" id="heroCredit" target="_blank" rel="noopener"></a></figure>

</main>

<div class="lightbox" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo">
  <div class="lb-top"><span class="lb-count" id="lbCount"></span><button id="lbClose" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="lb-img"><img id="lbImg" alt=""><button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous photo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><button class="lb-nav lb-next" id="lbNext" aria-label="Next photo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
  <div class="lb-cap" id="lbCap"></div>
</div>

  <div class="ev-panel">
    <div class="ev-top"><button class="ev-close" id="evClose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div><img id="evImg" alt="" hidden>
    <div class="ev-body"><div class="ev-date" id="evDate"></div><h3 id="evTitle"></h3><p id="evText"></p><div id="evXl"></div><div class="ev-src" id="evSrc"></div></div>
  </div>
</div>

<script src="common.js?v=2.7.1"></script>
<script>
"use strict";
/* Wander place page: richer detail about one place, opened from a card title on the main page.
   URL: place.html?id=<Wikidata ID>&lang=<reader's language>&local=<local language>&t=<title>&kind=area */
const $ = s => document.querySelector(s);
const P = new URLSearchParams(location.search);
const clean = v => (v||'').toLowerCase().replace(/[^a-z-]/g, '');
const QID = /^Q\d+$/.test(P.get('id')||'') ? P.get('id') : null;
const state = { userLang: clean(P.get('lang')) || 'en', local: clean(P.get('local')), kind: P.get('kind')==='area' ? 'area' : 'place' };
const LANGS = [...new Set([state.userLang, state.local, 'en'].filter(Boolean))];
const textOf = html => { const d = document.createElement('div'); d.innerHTML = html || ''; return (d.textContent || '').replace(/\s+/g, ' ').trim(); };
const yearIn = s => { const m = /(?:^|\D)(1[0-9]{3}|20[0-9]{2})(?!\d)/.exec(s||''); const y = m ? +m[1] : null; return y && y <= new Date().getFullYear() ? y : null; };
const section = (id, title, html, note='') => { $('#'+id).innerHTML = html ? `<h2>${esc(title)}${note?`<span>${note}</span>`:''}</h2>${html}` : ''; };

/* ---------- the Wikidata item: names, image, Commons category, articles ---------- */
async function loadItem(){
  try{
    const d = await fetchJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&origin=*&ids=${QID}&props=labels|descriptions|claims|sitelinks&languages=${LANGS.join('|')}`);
    const e = d.entities && d.entities[QID]; if(!e || e.missing!==undefined) throw new Error('not found');
    const pick = o => { for(const l of LANGS) if(o && o[l]) return o[l].value; const any = o && Object.values(o)[0]; return any ? any.value : ''; };
    const claim = p => ((e.claims||{})[p]||[]).map(c=>c.mainsnak && c.mainsnak.datavalue && c.mainsnak.datavalue.value).filter(Boolean);
    const coord = claim('P625')[0];
    const articles = {};
    for(const l of LANGS){ const s = (e.sitelinks||{})[l.replace(/-/g,'_')+'wiki']; if(s) articles[l] = s.title; }
    return { label: pick(e.labels), localLabel: state.local && e.labels && e.labels[state.local] ? e.labels[state.local].value : '', desc: pick(e.descriptions),
      image: claim('P18')[0] || '', cat: claim('P373')[0] || '', coord: coord ? [coord.latitude, coord.longitude] : null, articles };
  }catch(err){
    // Fallback: the same basics from the query service
    const rows = await sparql(`SELECT ?k ?v WHERE {
      { BIND("label" AS ?k) wd:${QID} rdfs:label ?v. FILTER(LANG(?v) IN (${LANGS.map(l=>`"${l}"`).join(',')})) }
      UNION { BIND("desc" AS ?k) wd:${QID} schema:description ?v. FILTER(LANG(?v) IN (${LANGS.map(l=>`"${l}"`).join(',')})) }
      UNION { BIND("image" AS ?k) wd:${QID} wdt:P18 ?v. } UNION { BIND("cat" AS ?k) wd:${QID} wdt:P373 ?v. }
      UNION { BIND("coord" AS ?k) wd:${QID} wdt:P625 ?v. }
      UNION { BIND("site" AS ?k) ?v schema:about wd:${QID}; schema:isPartOf ?w. FILTER(?w IN (${LANGS.map(l=>`<https://${l}.wikipedia.org/>`).join(',')})) } }`);
    const by = k => rows.filter(r=>r.k.value===k).map(r=>r.v);
    const inLang = k => { const L = by(k); for(const l of LANGS){ const r = L.find(v=>v['xml:lang']===l); if(r) return r.value; } return L[0] ? L[0].value : ''; };
    const articles = {};
    by('site').forEach(v=>{ const m = /^https:\/\/([a-z-]+)\.wikipedia\.org\/wiki\/(.+)$/.exec(v.value); if(m) articles[m[1]] = decodeURIComponent(m[2]).replace(/_/g,' '); });
    const pt = (by('coord')[0]||{}).value, cm = /Point\(([-\d.]+) ([-\d.]+)\)/.exec(pt||'');
    const img = (by('image')[0]||{}).value || '';
    const local = by('label').find(v=>v['xml:lang']===state.local);
    if(!rows.length) throw err;
    return { label: inLang('label'), localLabel: local ? local.value : '', desc: inLang('desc'), image: img ? decodeURIComponent(img.split('/').pop()).replace(/_/g,' ') : '',
      cat: (by('cat')[0]||{}).value || '', coord: cm ? [+cm[2], +cm[1]] : null, articles };
  }
}

/* ---------- Commons images with their credits ---------- */
const IMG_SKIP = /logo|icon|flag|coat[ _]of[ _]arms|signature|symbol|pictogram|locator|location[ _]map|disambig|commons-|wiki|stub|question[ _]book|edit-clear|padlock/i;
async function imageInfo(params, host){
  const base = host || 'https://commons.wikimedia.org/w/api.php?';
  const d = await fetchJSON(base + new URLSearchParams({action:'query', format:'json', formatversion:'2', origin:'*', prop:'imageinfo',
    iiprop:'url|extmetadata|mime|size', iiurlwidth:'500', iiextmetadatafilter:'ImageDescription|Artist|Credit|LicenseShortName|LicenseUrl|DateTimeOriginal|ObjectName|AttributionRequired', ...params}), 20000);
  return ((d.query && d.query.pages) || []).map(p=>{
    const ii = p.imageinfo && p.imageinfo[0]; if(!ii) return null;
    const md = ii.extmetadata || {}, v = k => md[k] ? md[k].value : '';
    const date = textOf(v('DateTimeOriginal'));
    return { title: p.title, thumb: ii.thumburl || ii.url, url: ii.url, w: ii.width, h: ii.height, mime: ii.mime, page: ii.descriptionurl,
      caption: textOf(v('ImageDescription')) || textOf(v('ObjectName')) || p.title.replace(/^File:/,'').replace(/\.\w+$/,''),
      artist: textOf(v('Artist')) || textOf(v('Credit')), license: textOf(v('LicenseShortName')), licenseUrl: v('LicenseUrl'), date, year: yearIn(date) };
  }).filter(Boolean);
}
const usable = f => /image\/(jpeg|png|webp|tiff|gif)/.test(f.mime) && f.w >= 320 && f.h >= 200 && !IMG_SKIP.test(f.title);
// Wikimedia only serves standard thumbnail widths (250, 330, 500, 960, 1280, 1920…); other widths are refused
const bigURL = f => f.w > 1280 && /\/\d+px-/.test(f.thumb) ? f.thumb.replace(/\/\d+px-/, '/1280px-') : f.url;
const creditText = f => [f.artist, f.license].filter(Boolean).join(' · ');

/* ---------- rendering pieces ---------- */
function renderHead(item){
  const title = cap(item.label || P.get('t') || 'Untitled');
  document.title = `${title} · Wander`;
  $('#title').textContent = title;
  $('#title').lang = item.label ? state.userLang : (state.local || state.userLang);
  $('#kind').textContent = item.desc ? cap(item.desc) : '';
  $('#sub').textContent = item.localLabel && item.localLabel !== title ? item.localLabel : '';
  if(item.localLabel) $('#sub').lang = state.local;
  let links = '';
  if(item.coord) links += `<a target="_blank" rel="noopener" href="${esc(mapsURL(item.coord[0], item.coord[1]))}">Google Maps</a>`;
  if(navigator.share) links += `<button id="shareBtn">Share</button>`;
  $('#links').innerHTML = links;
  if($('#shareBtn')) $('#shareBtn').onclick = ()=>navigator.share({title, url: location.href}).catch(()=>{});
}
function addLink(html){ $('#links').insertAdjacentHTML('beforeend', html); }
function renderHero(f){
  if(!f) return;
  $('#heroImg').src = bigURL(f);
  $('#heroImg').alt = f.caption;
  $('#heroCredit').textContent = creditText(f) || 'Wikimedia Commons';
  $('#heroCredit').href = f.page;
  $('#hero').hidden = false; $('#nohero').hidden = true;
}

/* ---------- gallery + lightbox ---------- */
let photos = [], at = 0;
function renderGallery(list){
  photos = list;
  if(!list.length){ $('#gallery').innerHTML = ''; return; }
  const dated = list.filter(f=>f.year).length;
  section('gallery', 'Photos', `<div class="gallery">${list.map((f,i)=>`<button data-i="${i}" aria-label="${esc(f.caption)}"><img loading="lazy" alt="" src="${esc(f.thumb)}">${f.year?`<span class="yr">${f.year}</span>`:''}</button>`).join('')}</div>`,
    `${list.length} from Wikimedia Commons${dated>2?', oldest first':''}`);
}
function openPhoto(i){
  at = (i + photos.length) % photos.length; const f = photos[at];
  $('#lbImg').src = bigURL(f); $('#lbImg').alt = f.caption;
  $('#lbCount').textContent = `${at+1} of ${photos.length}`;
  $('#lbCap').innerHTML = `${f.year?`<span class="d">${f.year}</span>`:''}${esc(trimText(f.caption, 400))}
    <span class="cr">${esc(creditText(f) || 'Wikimedia Commons')} · <a target="_blank" rel="noopener" href="${esc(f.page)}">Source</a></span>`;
  $('#lb').hidden = false; document.body.style.overflow = 'hidden';
}
function closePhoto(){ $('#lb').hidden = true; document.body.style.overflow = ''; }
$('#gallery').addEventListener('click', e=>{ const b = e.target.closest('[data-i]'); if(b) openPhoto(+b.dataset.i); });
$('#lbClose').onclick = closePhoto;
$('#lbPrev').onclick = ()=>openPhoto(at-1);
$('#lbNext').onclick = ()=>openPhoto(at+1);
$('#lb').addEventListener('click', e=>{ if(e.target.id==='lb' || e.target.classList.contains('lb-img')) closePhoto(); });
document.addEventListener('keydown', e=>{ if($('#lb').hidden) return; if(e.key==='Escape') closePhoto(); if(e.key==='ArrowLeft') openPhoto(at-1); if(e.key==='ArrowRight') openPhoto(at+1); });
{ let x0 = null; const box = $('.lb-img');
  box.addEventListener('touchstart', e=>{ x0 = e.touches[0].clientX; }, {passive:true});
  box.addEventListener('touchend', e=>{ if(x0==null) return; const dx = e.changedTouches[0].clientX - x0; if(Math.abs(dx) > 50) openPhoto(at + (dx<0 ? 1 : -1)); x0 = null; }); }

function renderCredits(article, images){
  let h = '';
  if(article) h += `Text from <a target="_blank" rel="noopener" href="${esc(article.url)}">Wikipedia</a> (<a target="_blank" rel="noopener" href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>). `;
  h += `Facts from <a target="_blank" rel="noopener" href="https://www.wikidata.org/wiki/${QID}">Wikidata</a>.`;
  if(images.length) h += ` Photos from Wikimedia Commons; each photo shows its author and licence when opened.
    <details><summary>Photo credits</summary><ol>${images.map(f=>`<li><a target="_blank" rel="noopener" href="${esc(f.page)}">${esc(trimText(f.caption, 80))}</a>${creditText(f)?' — '+esc(creditText(f)):''}</li>`).join('')}</ol></details>`;
  section('credits', 'Sources', `<p>${h}</p><p class="ver">Wander ${esc(WANDER_VERSION)}</p>`);
}

/* ---------- page ---------- */
async function main(){
  if(!QID){ fail('This link does not point to a place.'); return; }
  const ul = state.userLang;
  if(P.get('t')){ $('#title').textContent = P.get('t'); document.title = `${P.get('t')} · Wander`; }
  let item;
  try{ item = await loadItem(); }
  catch(e){ fail('Could not load this place. Check your connection and try again.'); return; }
  renderHead(item);
  const title = item.label || P.get('t') || '';
  const eventP = isEvent(QID);

  // Wikipedia: the reader's language first, then the local language, then English
  const order = LANGS.filter(l=>item.articles[l]);
  const artLang = order[0] || null;
  const articleP = artLang ? extractsFor(artLang, [item.articles[artLang]]).then(x=>{ const a = x[item.articles[artLang]]; return a ? {...a, lang: artLang} : null; }).catch(()=>null) : Promise.resolve(null);

  // Photos: the item's own image, its Commons category, then the article's images
  const heroP = item.image ? imageInfo({titles: 'File:'+item.image, iiurlwidth:'1280'}).then(x=>x[0]||null).catch(()=>null) : Promise.resolve(null);
  const catP = item.cat ? imageInfo({generator:'categorymembers', gcmtitle:'Category:'+item.cat, gcmtype:'file', gcmlimit:'60'}).catch(()=>[]) : Promise.resolve([]);
  const artImgP = artLang ? imageInfo({generator:'images', titles:item.articles[artLang], gimlimit:'40'}, `https://${artLang}.wikipedia.org/w/api.php?`).catch(()=>[]) : Promise.resolve([]);

  // Events get their own layout: key points and photos first, event facts, no building history
  const event = await eventP;
  if(event) document.body.classList.add('event');
  const triviaP = sparql(qFactoids(QID, state.kind, ul)).then(rows=>factoidList(rows, title)).catch(()=>[]);
  const m = {facts:[], events:[]};
  let factRows = [], ev = null;
  const factsP = event
    ? sparql(qEvent(QID, ul)).then(rows=>{ ev = eventFacts(rows); }).catch(()=>{})
    : sparql(qPlace(QID, ul)).then(rows=>{ factRows = rows; placeFacts(rows, m); }).catch(()=>{});
  const tlP = event ? Promise.resolve([]) : sparql(qTimeline(QID, ul)).catch(()=>[]);
  const histP = event ? Promise.resolve(null) : (async()=>{
    for(const lang of order){
      try{ const rows = timeline(await fullText(lang, item.articles[lang]), 10); if(rows.length) return {lang, rows}; }catch(e){}
    }
    return null;
  })();

  // Summary (events: key points, with the full introduction one tap away)
  const article = await articleP;
  if(article && article.extract){
    const paras = article.extract.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    const foreign = article.lang !== ul, L = esc(article.lang);
    const full = paras.map(p=>`<p lang="${L}">${esc(p)}</p>`).join('');
    const pts = event ? keyPoints(article.extract) : [];
    $('#summary').innerHTML = (pts.length >= 2
        ? `<h2>Key points</h2><ul class="points" lang="${L}">${pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><details class="fullsum"><summary>Read the full summary</summary>${full}</details>`
        : full)
      + (foreign ? `<p class="lang">From ${esc(langName(article.lang))} Wikipedia.</p>` + xlateHTML(article.extract, article.lang, {about: title, googleURL: translateLink(article.lang, article.title)}) : '');
    addLink(`<a target="_blank" rel="noopener" href="${esc(article.url)}">Wikipedia</a>`);
    $('#summary').dataset.wl = `a:${article.lang}:${article.title}`; delete $('#summary').dataset.wlDone;
    applyWikiLinks();
  } else {
    $('#summary').innerHTML = item.desc ? '' : `<p class="gather">No article has been written about this ${event ? 'event' : 'place'} yet.</p>`;
  }
  updatePageLang($('#page'), ul);

  // From the reader's own AI guide, if one covers this place
  const gp = guideFor(QID);
  if(gp){
    let h = gp.summary ? `<p class="gh-sum">${esc(gp.summary)}</p>` : '';
    if(gp.seeToday) h += `<p class="see"><b>What to look for${gp.kind ? ` · ${esc(gp.kind)}` : ''}</b>${esc(gp.seeToday)}${gp.located ? `<small>Location: ${esc(gp.located)}</small>` : ''}</p>`;
    if(gp.keyPoints.length) h += `<ul class="points">${gp.keyPoints.map(k=>`<li>${esc(k)}</li>`).join('')}</ul>`;
    if(gp.sources.length) h += `<ul class="gsrc">${gp.sources.map(x=>`<li><a target="_blank" rel="noopener" href="${esc(x.url)}">${esc(x.title)}</a></li>`).join('')}</ul>`;
    const wk = wlTerms(gp.terms); PAGE.guideKey = wk;
    section('guideSec', 'From your AI guide', wk ? `<div data-wl="t:${wk}">${h}</div>` : h, gp.folklore ? 'Folklore' : '');
    applyWikiLinks();
  }

  // Facts
  await factsP;
  const grid = F => `<dl class="factgrid">${F.map(([l,v])=>`<div${textOf(v).length>22?' class="wide"':''}><dt>${esc(l)}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
  if(event && ev){
    // date and place under the title
    const place = ev.where.length ? ev.where.slice(0,2).map(w=>`<a href="place.html?${esc(new URLSearchParams({id:w.qid, lang:ul, t:w.label}).toString())}">${esc(w.label)}</a>`).join(', ') : (ev.country ? esc(ev.country.label) : '');
    const line = [ev.when ? esc(ev.when) : '', place].filter(Boolean).join('<span class="sep">·</span>');
    if(line){ $('#when').innerHTML = line; $('#when').hidden = false; }
    if(ev.facts.length) section('facts', 'Key facts', grid(ev.facts));
  } else if(m.facts.length) section('facts', 'At a glance', grid(m.facts));

  // History: article sentences plus Wikidata milestones, in date order
  const hist = await histP;
  let rows = hist ? hist.rows : [], histLang = hist ? hist.lang : ul;
  if(m.events.length && (!rows.length || histLang===ul)){
    const seen = new Set(rows.map(r=>r.y));
    rows = [...rows, ...m.events.filter(e=>!seen.has(e.y))]; histLang = histLang || ul;
  }
  rows.sort((a,b)=>a.y-b.y);
  if(rows.length){
    const foreign = histLang !== ul;
    if(hist) PAGE.hist = {lang: hist.lang, title: item.articles[hist.lang]};
    section('history', 'History', `<ol class="timeline" lang="${esc(histLang)}"${hist && histLang === hist.lang ? ` data-wl="a:${esc(hist.lang)}:${esc(item.articles[hist.lang])}"` : ''}>${rows.map(r=>`<li><span class="yr">${esc(r.label)}</span><span>${esc(trimText(r.s, 320))}</span></li>`).join('')}</ol>`
      + (foreign ? xlateHTML(rows.map(r=>`${r.label}: ${r.s}`).join('\n'), histLang, {about: title}) : ''),
      foreign ? esc(langName(histLang)) : '');
  }

  // Trivia
  const trivia = [...(gp ? gp.trivia.map(esc) : []), ...await triviaP];
  if(trivia.length) section('trivia', 'Did you know', `<ul class="factoids">${trivia.map(f=>`<li>${f}</li>`).join('')}</ul>`);

  // Photos: hero first, then dated photos oldest first, then the rest
  const [hero, cat, artImgs] = await Promise.all([heroP, catP, artImgP]);
  const seen = new Set(), all = [];
  for(const f of [hero, ...cat, ...artImgs]) if(f && usable(f) && !seen.has(f.title)){ seen.add(f.title); all.push(f); }
  const heroPick = hero && usable(hero) ? hero : all[0];
  renderHero(heroPick);
  const gal = all.filter(f=>f!==heroPick).slice(0, event ? 60 : 48);
  gal.sort((a,b)=>(a.year||9999)-(b.year||9999));
  renderGallery(gal);
  renderCredits(article, all);
  updatePageLang($('#page'), ul);

  // The interactive timeline replaces the plain history list once everything is in (places only)
  if(event) return;
  const events = timelineEvents({hist, milestones: m.events, factRows, tlRows: await tlP, photos: gal, articleURL: article && article.url, guide: gp});
  if(events.length >= 3) renderTimeline(events, hist ? hist.lang : ul);
  applyWikiLinks();
  updatePageLang($('#page'), ul);
}
/* What to link a passage with: Wikipedia history uses that article's links; AI guide moments use the guide's terms */
const PAGE = {hist: null, guideKey: ''};
const wlSpecFor = e => e.kind === 'history' && PAGE.hist ? `a:${PAGE.hist.lang}:${PAGE.hist.title}` : e.kind === 'guide' && PAGE.guideKey ? `t:${PAGE.guideKey}` : '';

/* ---------- Event layout ---------- */
/* Is this item an event (anything Wikidata classes under "occurrence")? */
async function isEvent(q){
  // Walk up from the item's own classes (fast) rather than down from "occurrence" (huge, times out)
  try{ const rows = await sparql(`SELECT DISTINCT ?c WHERE { wd:${q} wdt:P31/wdt:P279* ?c } LIMIT 3000`); return rows.some(r=>r.c.value.endsWith('/Q1190554')); }
  catch(e){ return false; }
}
function qEvent(q, ul){
  return `SELECT ?kind ?pid ?val ?valLabel ?amt ?unitLabel ?time ?prec WHERE {
    { BIND("v" AS ?kind)
      VALUES ?pid { wd:P276 wd:P17 wd:P361 wd:P828 wd:P1478 wd:P1542 wd:P1346 wd:P710 wd:P664 wd:P3342 wd:P8031 wd:P155 wd:P156 }
      ?pid wikibase:directClaim ?wdt. wd:${q} ?wdt ?val. FILTER(isIRI(?val)) }
    UNION
    { BIND("n" AS ?kind)
      VALUES ?pid { wd:P585 wd:P580 wd:P582 wd:P1120 wd:P1339 wd:P1132 wd:P1110 wd:P2047 }
      ?pid wikibase:claim ?p; wikibase:statementValue ?psv.
      wd:${q} ?p ?st. ?st ?psv ?node. ?st wikibase:rank ?r. FILTER(?r != wikibase:DeprecatedRank)
      OPTIONAL { ?node wikibase:timeValue ?time; wikibase:timePrecision ?prec }
      OPTIONAL { ?node wikibase:quantityAmount ?amt; wikibase:quantityUnit ?unit } }
    SERVICE wikibase:label { bd:serviceParam wikibase:language "${ul},en". }
  } LIMIT 300`;
}
/* A date as precise as Wikidata knows it: "18 April 1906", "April 1906" or "1906" */
function fmtDate(t, prec){
  prec = +prec; const m = /^([+-]?)(\d+)-(\d\d)-(\d\d)/.exec(t||''); if(!m) return null;
  // Wikidata stores old dates converted to the modern calendar, so day and month before 1583 would be off: show the year only
  if(m[1]==='-' || prec < 10 || +m[2] < 1583) return fmtTime(t, Math.min(prec, 9));
  const d = new Date(Date.UTC(2000, +m[3]-1, Math.max(1, +m[4]))); d.setUTCFullYear(+m[2]);
  try{ return new Intl.DateTimeFormat(state.userLang, prec >= 11 ? {day:'numeric', month:'long', year:'numeric', timeZone:'UTC'} : {month:'long', year:'numeric', timeZone:'UTC'}).format(d); }
  catch(e){ return fmtTime(t, 9); }
}
function eventFacts(rows){
  const by = {};
  for(const r of rows){ const pid = r.pid.value.split('/').pop(); (by[pid] = by[pid] || []).push(r); }
  const items = pid => { const seen = new Set(); return (by[pid]||[]).filter(r=>r.kind.value==='v' && r.valLabel && !isQ(r.valLabel.value))
    .map(r=>({qid:r.val.value.split('/').pop(), label:r.valLabel.value})).filter(v=>!seen.has(v.qid) && seen.add(v.qid)); };
  const link = v => `<a href="place.html?${esc(new URLSearchParams({id:v.qid, lang:state.userLang, t:v.label}).toString())}">${esc(cap(v.label))}</a>`;
  const list = (pid, n=4) => { const L = items(pid); return L.length ? L.slice(0,n).map(link).join(', ') + (L.length > n ? ` <small>+${L.length-n} more</small>` : '') : ''; };
  const date = pid => { const r = (by[pid]||[]).find(r=>r.kind.value==='n' && r.time); return r ? fmtDate(r.time.value, r.prec && r.prec.value) : null; };
  const nums = pid => { const v = (by[pid]||[]).filter(r=>r.kind.value==='n' && r.amt).map(r=>Math.abs(+r.amt.value)); if(!v.length) return '';
    const lo = Math.min(...v), hi = Math.max(...v); if(!hi) return ''; return lo===hi ? fmtNum(lo) : `${fmtNum(lo)}–${fmtNum(hi)}`; };
  const at = date('P585'), from = date('P580'), to = date('P582');
  const when = at || (from && to && from!==to ? `${from} – ${to}` : from || to || '');
  const where = items('P276'), country = items('P17')[0];
  const F = [], add = (l, v) => { if(v) F.push([l, v]); };
  add('When', esc(when));
  add('Where', [where.slice(0,3).map(link).join(', '), country && !where.some(w=>w.qid===country.qid) ? esc(country.label) : ''].filter(Boolean).join(', '));
  add('Part of', list('P361', 2));
  add('Cause', [list('P1478', 2), list('P828', 3)].filter(Boolean).join(', '));
  add('Outcome', list('P1542', 3));
  add('Winner', list('P1346', 3));
  add('Participants', list('P710', 6));
  add('Organised by', list('P664', 3));
  add('Key people', list('P3342', 4));
  add('Perpetrator', list('P8031', 3));
  add('Deaths', nums('P1120')); add('Injured', nums('P1339'));
  add('People involved', nums('P1132')); add('Attendance', nums('P1110'));
  const dur = (by.P2047||[]).find(r=>r.amt);
  if(dur){ const n = +dur.amt.value, u = (dur.unitLabel||{}).value || ''; add('Lasted', esc(`${fmtNum(n)} ${u}${n!==1 && state.userLang==='en' && u && !/s$/.test(u) ? 's' : ''}`)); }
  add('Preceded by', list('P155', 1)); add('Followed by', list('P156', 1));
  return {facts:F, when, where, country};
}
/* Key points: the opening sentence of each paragraph of the article's introduction */
function keyPoints(extract){
  const paras = extract.split(/\n+/).map(s=>s.trim()).filter(Boolean), pts = [];
  for(const p of paras){ const s = sentences(p)[0]; if(s && s.length > 30) pts.push(s); if(pts.length >= 5) break; }
  if(pts.length < 3) for(const s of sentences(paras[0]||'').slice(1)){ if(pts.length >= 4) break; if(s.length > 30) pts.push(s); }
  return pts.map(s=>trimText(s, 300));
}

/* ---------- Interactive timeline ---------- */
/* Dated things connected to the place: heritage listing, events held there, notable burials, works set there. */
function qTimeline(q, ul){
  return `SELECT ?kind ?x ?xLabel ?t ?prec ?img ?links WHERE {
    { SELECT ("her" AS ?kind) ?x ?t ?prec WHERE { wd:${q} p:P1435 ?st. ?st ps:P1435 ?x; pqv:P580 [ wikibase:timeValue ?t; wikibase:timePrecision ?prec ]. } LIMIT 4 }
    UNION { SELECT ("event" AS ?kind) ?x ?links (MIN(?tt) AS ?t) (MAX(?pp) AS ?prec) (SAMPLE(?i) AS ?img) WHERE {
      ?x wdt:P276 wd:${q}; p:P585/psv:P585 [ wikibase:timeValue ?tt; wikibase:timePrecision ?pp ]; wikibase:sitelinks ?links. OPTIONAL { ?x wdt:P18 ?i } FILTER(?links > 0)
    } GROUP BY ?x ?links ORDER BY DESC(?links) LIMIT 12 }
    UNION { SELECT ("burial" AS ?kind) ?x ?links (MIN(?tt) AS ?t) (MAX(?pp) AS ?prec) (SAMPLE(?i) AS ?img) WHERE {
      ?x wdt:P119 wd:${q}; p:P570/psv:P570 [ wikibase:timeValue ?tt; wikibase:timePrecision ?pp ]; wikibase:sitelinks ?links. OPTIONAL { ?x wdt:P18 ?i }
    } GROUP BY ?x ?links ORDER BY DESC(?links) LIMIT 6 }
    UNION { SELECT ("work" AS ?kind) ?x ?links (MIN(?tt) AS ?t) (MAX(?pp) AS ?prec) WHERE {
      { ?x wdt:P840 wd:${q} } UNION { ?x wdt:P915 wd:${q} } ?x p:P577/psv:P577 [ wikibase:timeValue ?tt; wikibase:timePrecision ?pp ]; wikibase:sitelinks ?links. FILTER(?links > 2)
    } GROUP BY ?x ?links ORDER BY DESC(?links) LIMIT 5 }
    SERVICE wikibase:label { bd:serviceParam wikibase:language "${ul},en". } }`;
}
const fileOf = uri => uri ? decodeURIComponent(uri.split('/').pop()).replace(/_/g, ' ') : '';
const fileThumb = file => file ? `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(file)}?width=250` : '';
const yearLabel = y => y < 0 ? `${-y} BCE` : String(y);

/* Gather every dated thing into one list. w = how much it deserves a card when space is short. */
function timelineEvents({hist, milestones, factRows, tlRows, photos, articleURL, guide}){
  const ev = [], add = e => { if(e.y!=null && isFinite(e.y) && e.title) ev.push(e); };
  const KEY = {P571:'Founded or built', P1619:'Officially opened', P576:'Closed or demolished'};
  for(const pid in KEY){
    const r = factRows.find(r=>r.pid.value.endsWith('/'+pid) && r.kind.value==='n' && r.time);
    if(r){ const label = fmtTime(r.time.value, r.prec && r.prec.value); if(label) add({y:yearNum(r.time.value), label, title:KEY[pid], kind:'key', src:'Wikidata', w:4}); }
  }
  for(const r of (hist ? hist.rows : [])) add({y:r.y, label:r.label, title:trimText(r.s, 110), text:r.s, kind:'history', src:'Wikipedia', url:articleURL, lang:hist.lang, w:2});
  for(const r of milestones) add({y:r.y, label:r.label, title:r.s, kind:'milestone', src:'Wikidata', w:3});
  for(const r of tlRows){
    const name = r.xLabel && !isQ(r.xLabel.value) ? r.xLabel.value : ''; if(!name || !r.t) continue;
    const y = yearNum(r.t.value), label = fmtTime(r.t.value, r.prec && r.prec.value) || (y!=null ? yearLabel(y) : '');
    const file = fileOf(r.img && r.img.value), qid = r.x.value.split('/').pop(), kind = r.kind.value;
    if(kind==='her') add({y, label, title:`Designated ${name}`, kind:'key', src:'Wikidata', w:3});
    if(kind==='event') add({y, label, title:cap(name), kind:'event', qid, file, thumb:fileThumb(file), src:'Wikidata', w:file ? 5 : 4});
    if(kind==='burial') add({y, label, title:`${name} laid to rest here`, kind:'burial', qid, file, thumb:fileThumb(file), src:'Wikidata', w:2});
    if(kind==='work') add({y, label, title:`Appears in ${name}`, kind:'work', qid, src:'Wikidata', w:1});
  }
  for(const t of (guide ? guide.timeline : [])){   // the reader's AI guide
    const yy = yearOf(t.date) || yearOf(t.text); if(!yy) continue;
    add({y:yy.y, label:t.date || yy.label, title:trimText(t.text, 110), text:t.text, kind:'guide', src:'AI guide', url:(guide.sources[0]||{}).url, w:3});
  }
  const old = new Date().getFullYear() - 30;   // historic photos only; recent ones stay in the gallery
  for(const f of photos) if(f.year && f.year <= old) add({y:f.year, label:String(f.year), title:trimText(f.caption, 110), text:f.caption, kind:'photo', photo:f, thumb:f.thumb, src:'Commons', w:2});
  // drop exact repeats, keep the most important 70, then order by date
  const seen = new Set();
  return ev.filter(e=>{ const k = e.y+'|'+e.title.slice(0,40).toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; })
    .sort((a,b)=>b.w-a.w || a.y-b.y).slice(0, 70).sort((a,b)=>a.y-b.y || b.w-a.w);
}

function renderTimeline(events, histLang){
  const ul = state.userLang, foreign = events.some(e=>e.kind==='history') && histLang !== ul;
  section('history', 'History', `
    <div class="tl-wrap">
      <div class="tl" id="tl" tabindex="0" aria-label="Timeline. Drag to move, pinch or use the buttons to zoom.">
        <div class="tl-ticks"></div><div class="tl-axis"></div><div class="tl-breaks"></div><div class="tl-stage"></div>
      </div>
      <div class="tl-bar"><p class="tl-hint">Drag to move · pinch or + − to zoom · tap a moment</p>
        <div class="tl-ctrl"><button data-z="out" aria-label="Zoom out">−</button><button data-z="in" aria-label="Zoom in">+</button><button data-z="fit" aria-label="Show everything">Fit</button></div></div>
    </div>
    <ol class="timeline tl-list">${events.map((e,i)=>`<li data-i="${i}"><span class="yr">${esc(e.label)}</span><span class="tx">${e.thumb?`<img loading="lazy" alt="" src="${esc(e.thumb)}">`:''}<span${e.lang?` lang="${esc(e.lang)}"`:''}${wlSpecFor(e) ? ` data-wl="${esc(wlSpecFor(e))}"` : ''}>${esc(e.kind==='history' ? trimText(e.text, 320) : e.title)}</span></span></li>`).join('')}</ol>`
    + (foreign ? xlateHTML(events.filter(e=>e.kind==='history').map(e=>`${e.label}: ${e.text}`).join('\n'), histLang, {about: document.title.replace(/ · Wander$/, '')}) : ''),
    `${events.length} moments`);
  const rows = [...document.querySelectorAll('.tl-list li')];
  const tl = makeTimeline($('#tl'), events, i=>openEvent(events[i]), vis=>rows.forEach((r,i)=>r.classList.toggle('vis', vis.has(i))));
  $('.tl-list').addEventListener('click', ev=>{ const li = ev.target.closest('li[data-i]'); if(!li) return; const i = +li.dataset.i; tl.focus(i); openEvent(events[i]); });
}

/* A horizontal, pannable, zoomable timeline drawn with positioned HTML. Long empty stretches are squeezed into breaks. */
function makeTimeline(root, events, onOpen, onView){
  const CARD = 136, LANES = [10, 78, 146], AXIS = 222, PAD = 24;
  // squeezed time scale: gaps longer than G years count for much less
  const Ys = [...new Set(events.map(e=>e.y))].sort((a,b)=>a-b), n = Ys.length - 1;
  const G = Math.max(12, (Ys[n] - Ys[0]) / 12), U = [0], breaks = [];
  for(let i=1; i<=n; i++){ const gap = Ys[i]-Ys[i-1]; U.push(U[i-1] + (gap <= G ? gap : G + (gap-G)*.12)); if(gap > 2.2*G && gap >= 40) breaks.push({i, gap}); }
  const seg = (A, B, v) => { let lo = 0, hi = n; while(hi-lo > 1){ const mid = (lo+hi)>>1; if(A[mid] <= v) lo = mid; else hi = mid; } return [lo, hi]; };
  const toU = y => y <= Ys[0] ? y-Ys[0] : y >= Ys[n] ? U[n]+(y-Ys[n]) : (([a,b]) => U[a]+(U[b]-U[a])*(y-Ys[a])/(Ys[b]-Ys[a]))(seg(Ys, Ys, y));
  const toY = v => v <= U[0] ? Ys[0]+(v-U[0]) : v >= U[n] ? Ys[n]+(v-U[n]) : (([a,b]) => Ys[a]+(Ys[b]-Ys[a])*(v-U[a])/(U[b]-U[a]))(seg(U, U, v));
  events.forEach(e=>e.u = toU(e.y));
  const uMin = U[0], uMax = U[n], W = () => root.clientWidth || 360;
  const fitK = () => Math.max(.02, (W() - PAD - CARD - 14) / Math.max(uMax - uMin, 8));
  let k = fitK(), u0 = uMin - PAD/k, fitted = true, raf = 0;
  const kMax = () => Math.max(fitK()*3, 70);
  const clamp = () => {
    k = Math.min(kMax(), Math.max(fitK()*.85, k)); const w = W();
    const lo = uMin - PAD/k, hi = uMax - (w - CARD - 24)/k;   // u0 range that keeps the moments on screen
    u0 = hi <= lo ? lo : Math.min(hi, Math.max(lo, u0));
  };
  const draw = () => { raf = 0; render(); }, later = () => { if(!raf) raf = requestAnimationFrame(draw); };

  // one card, stem and dot per event, created once and moved on every frame
  const stage = root.querySelector('.tl-stage');
  events.forEach((e, i)=>{
    e.dot = Object.assign(document.createElement('div'), {className:'tl-dot '+e.kind});
    e.stem = Object.assign(document.createElement('div'), {className:'tl-stem'});
    e.el = document.createElement('button'); e.el.className = 'tl-card ' + e.kind; e.el.dataset.i = i;
    e.el.innerHTML = `${e.thumb?`<img loading="lazy" alt="" src="${esc(e.thumb)}">`:''}<span class="tx"><b>${esc(e.label)}</b><span>${esc(e.title)}</span></span><i class="more" data-more="${i}"></i>`;
    e.badge = e.el.querySelector('.more');
    stage.append(e.stem, e.dot, e.el);
  });
  function render(){
    const w = W(), x = e => (e.u - u0) * k;
    // ticks: a round year step that leaves room between labels
    const yA = toY(u0), yB = toY(u0 + w/k), steps = [1,2,5,10,20,25,50,100,200,250,500,1000,2000];
    const step = steps.find(s => (yB - yA)/s <= Math.max(3, w/80)) || 5000;
    let ticks = '', last = -1e9;
    const yEnd = Math.min(yB, Math.max(Ys[n], new Date().getFullYear()));
    for(let t = Math.ceil(yA/step)*step; t <= yEnd; t += step){
      if(breaks.some(b => t > Ys[b.i-1] && t < Ys[b.i])) continue;
      const tx = (toU(t) - u0) * k; if(tx - last < 48) continue; last = tx;
      ticks += `<div class="tl-tick" style="left:${tx}px"><span>${yearLabel(t)}</span></div>`;
    }
    root.querySelector('.tl-ticks').innerHTML = ticks;
    root.querySelector('.tl-breaks').innerHTML = breaks.map(b=>{ const x1 = (U[b.i-1]-u0)*k + 8, x2 = (U[b.i]-u0)*k - 8;
      return x2 - x1 > 30 && x2 > 0 && x1 < w ? `<div class="tl-break" style="left:${x1}px;width:${x2-x1}px"><span>${x2-x1 > 70 ? `${b.gap} years` : '⋯'}</span></div>` : ''; }).join('');
    // cards: most important first, each into the first lane with room; the rest become +N on a neighbour
    const lanes = LANES.map(()=>[]), placed = [];
    events.forEach(e=>{ e._x = x(e); e._lane = -1; e._more = 0; });
    for(const e of [...events].sort((a,b)=>b.w-a.w || a.y-b.y)){
      if(e._x < -CARD || e._x > w + 20) continue;
      const L = e._x - 18, R = L + CARD + 6, l = lanes.findIndex(sp => sp.every(([a,b]) => R <= a || L >= b));
      if(l < 0) continue; lanes[l].push([L, R]); e._lane = l; placed.push(e);
    }
    for(const e of events){
      if(e._lane >= 0 || e._x < 0 || e._x > w) continue;
      let best = null, bd = 1e9;
      for(const p of placed){ const L = p._x - 18; if(e._x >= L - 6 && e._x <= L + CARD + 6){ const d = Math.abs(e._x - p._x); if(d < bd){ bd = d; best = p; } } }
      if(best) best._more++;
    }
    const vis = new Set();
    events.forEach((e, i)=>{
      const on = e._lane >= 0, inView = e._x >= -4 && e._x <= w + 4;
      if(inView) vis.add(i);
      e.dot.style.display = inView ? '' : 'none'; e.dot.style.left = e._x + 'px';
      e.el.style.display = on ? '' : 'none'; e.stem.style.display = on ? '' : 'none';
      if(on){ const top = LANES[e._lane]; e.el.style.transform = `translate(${e._x - 18}px, ${top}px)`; e.stem.style.cssText = `left:${e._x}px;top:${top+60}px;height:${AXIS-top-60}px`;
        e.badge.textContent = e._more ? '+' + e._more : ''; e.badge.style.display = e._more ? '' : 'none'; }
    });
    onView(vis);
  }
  function zoomAt(px, f){ const ua = u0 + px/k; k *= f; clamp(); u0 = ua - px/k; clamp(); fitted = false; later(); }
  function fit(){ k = fitK(); u0 = uMin - PAD/k; fitted = true; later(); }

  // drag to pan, two fingers to pinch, a short touch is a tap
  const pts = new Map(); let down = null, pinch = null;
  root.addEventListener('pointerdown', ev=>{
    root.setPointerCapture(ev.pointerId); pts.set(ev.pointerId, {x:ev.clientX});
    if(pts.size === 1) down = {x:ev.clientX, t:Date.now(), target:ev.target, u0, moved:false};
    if(pts.size === 2){ const [a,b] = [...pts.values()], left = root.getBoundingClientRect().left; pinch = {d:Math.abs(a.x-b.x)||1, mid:(a.x+b.x)/2 - left, k, u0}; down = null; }
  });
  root.addEventListener('pointermove', ev=>{
    if(!pts.has(ev.pointerId)) return; pts.get(ev.pointerId).x = ev.clientX;
    if(pinch && pts.size === 2){
      const [a,b] = [...pts.values()], left = root.getBoundingClientRect().left, ua = pinch.u0 + pinch.mid/pinch.k;
      k = pinch.k * (Math.abs(a.x-b.x)||1) / pinch.d; clamp(); u0 = ua - ((a.x+b.x)/2 - left)/k; clamp(); fitted = false; later();
    } else if(down){
      const dx = ev.clientX - down.x; if(Math.abs(dx) > 6) down.moved = true;
      if(down.moved){ u0 = down.u0 - dx/k; clamp(); fitted = false; later(); }
    }
  });
  const up = ev=>{
    pts.delete(ev.pointerId);
    if(down && !down.moved && ev.type === 'pointerup' && Date.now() - down.t < 600){
      const more = down.target.closest('[data-more]'), card = down.target.closest('[data-i]');
      if(more && more.textContent){ const e = events[+more.dataset.more]; zoomAt(e._x, 2.6); }
      else if(card) onOpen(+card.dataset.i);
    }
    if(pts.size === 1 && pinch){ const [p] = [...pts.values()]; down = {x:p.x, t:0, target:root, u0, moved:true}; }
    else if(pts.size === 0) down = null;
    if(pts.size < 2) pinch = null;
  };
  root.addEventListener('pointerup', up); root.addEventListener('pointercancel', up);
  // trackpads: sideways scroll pans, pinch (ctrl + wheel) zooms; plain vertical scroll still scrolls the page
  root.addEventListener('wheel', ev=>{
    const left = root.getBoundingClientRect().left;
    if(ev.ctrlKey || ev.metaKey){ ev.preventDefault(); zoomAt(ev.clientX - left, Math.exp(-ev.deltaY * .01)); }
    else if(Math.abs(ev.deltaX) > Math.abs(ev.deltaY)){ ev.preventDefault(); u0 += ev.deltaX / k; clamp(); fitted = false; later(); }
  }, {passive:false});
  root.addEventListener('keydown', ev=>{
    const w = W();
    if(ev.key==='ArrowLeft' || ev.key==='ArrowRight'){ ev.preventDefault(); u0 += (ev.key==='ArrowLeft' ? -1 : 1) * w*.25/k; clamp(); fitted = false; later(); }
    if(ev.key==='+' || ev.key==='='){ zoomAt(w/2, 1.6); } if(ev.key==='-'){ zoomAt(w/2, 1/1.6); }
  });
  root.parentElement.querySelector('.tl-ctrl').addEventListener('click', ev=>{ const z = ev.target.closest('[data-z]'); if(!z) return; const w = W();
    if(z.dataset.z==='in') zoomAt(w/2, 1.8); if(z.dataset.z==='out') zoomAt(w/2, 1/1.8); if(z.dataset.z==='fit') fit(); });
  if(window.ResizeObserver) new ResizeObserver(()=>{ fitted ? fit() : (clamp(), later()); }).observe(root);
  render();
  return { focus(i){ const e = events[i], w = W(); k = Math.max(k, Math.min(kMax(), fitK()*4)); u0 = e.u - (w/2 - CARD/2)/k; clamp(); fitted = false; later();
    root.scrollIntoView({behavior:'smooth', block:'center'}); } };
}

/* The sheet that opens when a moment is tapped */
async function openEvent(e){
  const big = e.photo ? bigURL(e.photo) : e.thumb || '';
  $('#evImg').hidden = !big; if(big){ $('#evImg').src = big; $('#evImg').alt = ''; }
  $('#evDate').textContent = e.label;
  $('#evTitle').textContent = e.kind==='history' || e.kind==='photo' || e.kind==='guide' ? '' : e.title;
  $('#evText').textContent = e.text || '';
  delete $('#evText').dataset.wlDone; $('#evText').dataset.wl = wlSpecFor(e); applyWikiLinks();
  if(e.lang) $('#evText').lang = e.lang;
  let src = '';
  if(e.photo) src = `${esc(creditText(e.photo) || 'Wikimedia Commons')} · <a target="_blank" rel="noopener" href="${esc(e.photo.page)}">Photo source</a>`;
  else if(e.kind==='guide') src = `From your AI guide${e.url ? ` · <a target="_blank" rel="noopener" href="${esc(e.url)}">source</a>` : ''}`;
  else if(e.src==='Wikipedia' && e.url) src = `From <a target="_blank" rel="noopener" href="${esc(e.url)}">Wikipedia</a>`;
  else if(e.qid) src = `<a href="place.html?${esc(new URLSearchParams({id:e.qid, lang:state.userLang, t:e.title}).toString())}">More about this</a> · from Wikidata`;
  else src = `From <a target="_blank" rel="noopener" href="https://www.wikidata.org/wiki/${QID}">Wikidata</a>`;
  $('#evSrc').innerHTML = src;
  $('#evXl').innerHTML = e.text && e.lang ? xlateHTML(e.text, e.lang, {about: document.title.replace(/ · Wander$/, '')}) : '';
  $('#ev').hidden = false; document.body.style.overflow = 'hidden'; $('#evClose').focus();
  // a sharper image and its credit, fetched only when opened
  if(e.file && !e.info){
    try{ e.info = (await imageInfo({titles:'File:'+e.file, iiurlwidth:'1280'}))[0]; }catch(err){ e.info = null; }
    if(e.info && !$('#ev').hidden && $('#evDate').textContent === e.label){
      $('#evImg').src = bigURL(e.info);
      $('#evSrc').insertAdjacentHTML('afterbegin', `<span class="cr">Image: ${esc(creditText(e.info) || 'Wikimedia Commons')} · <a target="_blank" rel="noopener" href="${esc(e.info.page)}">source</a></span>`);
    }
  }
}
function closeEvent(){ $('#ev').hidden = true; document.body.style.overflow = ''; }
$('#evClose').onclick = closeEvent;
$('#ev').addEventListener('click', ev=>{ if(ev.target.id==='ev') closeEvent(); });
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape' && !$('#ev').hidden) closeEvent(); });

/* Back to Wander: return to the list where you left it if you came from there */
$('#homeBtn').addEventListener('click', e => {
  // Came straight from the main list: step back, which returns to it exactly as it was. Otherwise open it; it restores itself.
  let from = null; try{ from = document.referrer ? new URL(document.referrer) : null; }catch(_){}
  if(history.length > 1 && from && from.origin === location.origin && !/place\.html$/.test(from.pathname)){ e.preventDefault(); history.back(); }
});
function fail(msg){
  $('#page').innerHTML = `<div class="err"><h1>${esc(P.get('t') || 'Place not found')}</h1><p>${esc(msg)}</p><p><a href="./">Back to Wander</a></p></div>`;
}
main();
</script>
